<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Filter Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur" />
    </filter>
  </defs>

  <style><![CDATA[
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }

    /* Ambient Pulsing & Dynamic Background Orbs */
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px); }
      50% { transform: translate(-25px, 25px); }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes beaconPulse {
      0% { r: 4px; opacity: 1; }
      100% { r: 18px; opacity: 0; }
    }

    .orb-cyan {
      transform-origin: 200px 180px;
      animation: floatOrb1 10s ease-in-out infinite, pulseGlow 7s ease-in-out infinite;
    }
    .orb-purple {
      transform-origin: 1000px 220px;
      animation: floatOrb2 12s ease-in-out infinite, pulseGlow 9s ease-in-out infinite;
    }
    .radar-rotator {
      transform-origin: 1020px 210px;
      animation: radarSweep 14s linear infinite;
    }
    .flowing-stream {
      stroke-dasharray: 8, 8;
      animation: dashMove 2.5s linear infinite;
    }
    .beacon-ring {
      animation: beaconPulse 2.8s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
  ]]></style>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Background Animated Glowing Orbs (Strictly in Background) -->
  <g class="orb-cyan">
    <circle cx="180" cy="150" r="140" fill="#0284c7" opacity="0.25" filter="url(#softGlow)"/>
  </g>
  <g class="orb-purple">
    <circle cx="1020" cy="210" r="160" fill="#6366f1" opacity="0.25" filter="url(#softGlow)"/>
  </g>

  <!-- Dynamic Cyber Radar / Constellation Node Graphic (Right Side) -->
  <g id="radar-graphic" transform="translate(0, 0)">
    <!-- Radar concentric rings -->
    <circle cx="1020" cy="210" r="130" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4, 4" opacity="0.4" />
    <circle cx="1020" cy="210" r="95" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.25" />
    <circle cx="1020" cy="210" r="60" fill="none" stroke="#6366f1" stroke-width="1.2" opacity="0.35" />
    <circle cx="1020" cy="210" r="25" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />

    <!-- Radar Crosshairs -->
    <line x1="880" y1="210" x2="1160" y2="210" stroke="#334155" stroke-width="1" stroke-dasharray="2, 4" opacity="0.5" />
    <line x1="1020" y1="70" x2="1020" y2="350" stroke="#334155" stroke-width="1" stroke-dasharray="2, 4" opacity="0.5" />

    <!-- Sweeping Radar Beam -->
    <g class="radar-rotator">
      <path d="M 1020 210 L 1150 145 A 130 130 0 0 0 1020 80 Z" fill="url(#shieldGrad)" opacity="0.18" />
      <line x1="1020" y1="210" x2="1150" y2="145" stroke="#38bdf8" stroke-width="1.5" opacity="0.7" />
    </g>

    <!-- Radar Blips / Workload Nodes -->
    <circle cx="970" cy="160" r="4.5" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="970" cy="160" r="4" fill="none" stroke="#38bdf8" class="beacon-ring" stroke-width="1.5"/>

    <circle cx="1080" cy="170" r="4.5" fill="#a855f7" filter="url(#glow)"/>
    <circle cx="1060" cy="270" r="4" fill="#34d399" filter="url(#glow)"/>

    <!-- Dynamic Flow Lines -->
    <path d="M 850 210 Q 930 210 970 160" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flowing-stream" opacity="0.5"/>
    <path d="M 970 160 Q 1020 120 1080 170" fill="none" stroke="#818cf8" stroke-width="1.5" class="flowing-stream" opacity="0.5"/>
  </g>

  <!-- Foreground Content (Always crisp, prominent, unobstructed) -->
  <g transform="translate(80, 0)">
    <!-- Category Super-Title / Pill -->
    <g transform="translate(0, 52)">
      <rect width="250" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
      <circle cx="16" cy="16" r="5" fill="#38bdf8" filter="url(#glow)"/>
      <text x="32" y="21" class="tag-text">THREAT DETECTION &amp; CNAPP</text>
    </g>

    <!-- Main Title with Gradient Accent -->
    <g transform="translate(0, 134)">
      <text class="title-text">Awesome Cloud Security</text>
      <text x="0" y="48" class="title-text" fill="url(#accentGrad)">Threat Detection</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 222)">
      <text class="subtitle-text">Curated Architectures, SaaS Leaders &amp; Open-Source Detection Engines</text>
      <text x="0" y="28" class="subtitle-text" font-size="15px" fill="#64748b">Covering CNAPP, CSPM, CWPP, eBPF Runtime Detection &amp; Cloud SIEM</text>
    </g>

    <!-- Feature Attribute Badges / Ecosystem Pills -->
    <g transform="translate(0, 310)">
      <!-- Pill 1: CNAPP -->
      <g transform="translate(0, 0)">
        <rect width="115" height="36" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="18" r="4" fill="#38bdf8"/>
        <text x="32" y="23" class="pill-label">CNAPP</text>
      </g>

      <!-- Pill 2: eBPF Runtime -->
      <g transform="translate(127, 0)">
        <rect width="145" height="36" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="18" r="4" fill="#818cf8"/>
        <text x="32" y="23" class="pill-label">eBPF Runtime</text>
      </g>

      <!-- Pill 3: Multi-Cloud CSPM -->
      <g transform="translate(284, 0)">
        <rect width="175" height="36" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="18" r="4" fill="#c084fc"/>
        <text x="32" y="23" class="pill-label">Multi-Cloud CSPM</text>
      </g>

      <!-- Pill 4: Cloud SIEM &amp; XDR -->
      <g transform="translate(471, 0)">
        <rect width="170" height="36" rx="8" fill="url(#pillGrad)" stroke="#334155" stroke-width="1"/>
        <circle cx="18" cy="18" r="4" fill="#34d399"/>
        <text x="32" y="23" class="pill-label">Cloud SIEM &amp; XDR</text>
      </g>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.8"/>
</svg>
